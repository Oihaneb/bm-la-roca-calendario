name: Publicar calendario en GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio
        run: |
          mkdir -p public

          cp bm-la-roca.ics public/bm-la-roca.ics

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
