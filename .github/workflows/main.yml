name: Actualizar calendario BM La Roca

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

  push:
    paths:
      - "generar_calendario.py"
      - "requirements.txt"
      - ".github/workflows/actualizar-calendario.yml"

permissions:
  contents: write

jobs:

  actualizar:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Generar calendario
        run: |
          python generar_calendario.py

      - name: Guardar calendario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bm-la-roca.ics

          git diff --cached --quiet || \
            git commit -m "Actualizar calendario BM La Roca"

          git push
